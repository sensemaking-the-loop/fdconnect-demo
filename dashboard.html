<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Development Connect: Dashboards — Duke CTL</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Source+Sans+3:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, sans-serif;
    background: #f4f6f9; min-height: 100vh; color: #1a2a3a;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #c5d9ed; border-radius: 3px; }

  /* Header */
  .db-header {
    background: linear-gradient(135deg, #001A33 0%, #003366 40%, #1a5276 100%);
    padding: 0 20px; box-shadow: 0 4px 24px rgba(0,26,51,0.2);
  }
  .db-header-inner {
    max-width: 1100px; margin: 0 auto; padding: 24px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  /* System name in regular, page name in semibold: the four pages read as one
     system with a changing suffix rather than four separate titles. Both
     weights are already in the font request above. */
  .db-header-title {
    font-size: 26px; font-weight: 500; color: #fff;
    font-family: 'Playfair Display', Georgia, serif; letter-spacing: 0.3px;
  }
  .db-header-title b { font-weight: 700; }
  .db-header-sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 4px; letter-spacing: 0.5px; }
  .db-live { display: flex; align-items: center; gap: 8px; }
  .db-live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5);
  }
  .db-live span { font-size: 12px; color: rgba(255,255,255,0.5); }
  .db-refresh-btn {
    margin-left: 16px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
    color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
  }

  /* Tabs */
  .db-tabs {
    background: #fff; border-bottom: 1px solid #e8edf2;
    padding: 0 20px; position: sticky; top: 0; z-index: 50;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .db-tabs-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 4px; }
  .db-tab {
    padding: 14px 18px; border: none; background: none; cursor: pointer;
    font-size: 14px; font-family: 'Source Sans 3', sans-serif;
    color: #94a3b8; font-weight: 500; border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .db-tab.active { color: #003366; border-bottom-color: #003366; font-weight: 700; }

  /* Fiscal-year selector bar — global filter driving all four sections */
  .db-fybar { max-width: 1100px; margin: 20px auto 0; padding: 0 20px; display: flex; justify-content: flex-end; }
  .db-fybar-inner { display: flex; align-items: center; gap: 10px; }
  .db-fybar-text { font-size: 12px; font-weight: 600; color: #64748b; }
  .db-fy-select {
    font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 700;
    color: #003366; background: #f0f4f8; border: 1px solid #d1d9e0; border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  .db-fy-select:hover { border-color: #b1bdc7; }

  /* Year over Year comparison section */
  .db-yoy-banner { background:#eaf2fb; color:#1a5276; font-size:13px; line-height:1.5; border-radius:8px; padding:9px 14px; margin:0 0 16px; }
  .db-yoy-legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:#64748b; margin:0 0 4px; }
  .db-yoy-legend .k { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
  .db-yoy-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
  .db-yoy-kpi { background:#f8fafc; border:1px solid #e8edf2; border-radius:10px; padding:14px 16px; }
  .db-yoy-kpi-label { font-size:13px; color:#64748b; margin-bottom:6px; }
  .db-yoy-kpi-row { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .db-yoy-kpi-yr { font-size:11px; color:#94a3b8; min-width:56px; }
  .db-yoy-kpi-track { flex:1; height:10px; background:#eef2f6; border-radius:3px; overflow:hidden; }
  .db-yoy-kpi-fill { height:100%; border-radius:3px; }
  .db-yoy-kpi-num { font-family:'Playfair Display',serif; font-size:18px; color:#1a2a3a; min-width:34px; text-align:right; }
  .db-yoy-kpi-total { border-top:1px solid #e8edf2; margin-top:3px; padding-top:6px; }
  .db-yoy-kpi-totlab { color:#003366; font-weight:700; white-space:nowrap; }
  .db-yoy-kpi-totnum { color:#003366; }
  .db-yoy-grp { display:flex; flex-direction:column; gap:9px; }
  .db-yoy-row { display:grid; grid-template-columns:130px 1fr; align-items:center; gap:12px; }
  .db-yoy-label { font-size:13px; color:#475569; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .db-yoy-bars { display:flex; flex-direction:column; gap:3px; }
  .db-yoy-bar { display:flex; align-items:center; gap:8px; }
  .db-yoy-track { flex:1; height:13px; background:#eef2f6; border-radius:4px; overflow:hidden; }
  .db-yoy-fill { height:100%; border-radius:4px; }
  .db-yoy-val { min-width:96px; font-size:12px; color:#94a3b8; white-space:nowrap; }
  .db-yoy-val .e { font-weight:700; color:#1a2a3a; }
  .db-yoy-pf { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .db-yoy-pf-col { background:#f8fafc; border:1px solid #e8edf2; border-radius:10px; padding:14px 16px; }
  .db-yoy-pf-hd { font-size:14px; font-weight:700; color:#1a2a3a; }
  .db-yoy-pf-sub { font-size:12px; color:#64748b; margin-bottom:2px; }
  .db-yoy-pf-prog { padding:8px 0; border-top:1px solid #e8edf2; }
  .db-yoy-pf-name { font-size:13px; color:#1a2a3a; }
  .db-yoy-pf-tag { font-size:11px; color:#1a5276; background:#eaf2fb; border-radius:4px; padding:1px 6px; margin-left:4px; white-space:nowrap; }
  .db-yoy-pf-stats { display:flex; flex-wrap:wrap; gap:12px; margin-top:4px; font-size:12px; color:#64748b; }
  .db-yoy-pf-stats b { color:#1a2a3a; font-weight:700; }
  @media (max-width:700px){ .db-yoy-pf { grid-template-columns:1fr; } .db-yoy-row { grid-template-columns:96px 1fr; } }

  /* Content */
  .db-content { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  .db-section { animation: fadeIn 0.3s ease; }
  .hidden { display: none !important; }

  /* KPI Cards */
  .db-kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .db-kpi {
    background: #fff; border-radius: 16px; padding: 24px 20px;
    box-shadow: 0 1px 8px rgba(0,20,50,0.06); border: 1px solid #e8edf2;
    flex: 1 1 0; min-width: 140; position: relative; overflow: hidden;
  }
  .db-kpi-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .db-kpi-num {
    font-size: 36px; font-weight: 800; line-height: 1;
    font-family: 'Playfair Display', Georgia, serif;
  }
  .db-kpi-label { font-size: 13px; font-weight: 600; color: #475569; margin-top: 6px; }
  .db-kpi-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  /* Panels */
  .db-panels { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .db-panel {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 1px 8px rgba(0,20,50,0.06); border: 1px solid #e8edf2;
    flex: 1 1 0; min-width: 340;
  }
  .db-panel-title {
    font-size: 16px; font-weight: 700; color: #1a2a3a; margin: 0 0 16px;
    font-family: 'Playfair Display', Georgia, serif;
  }
  .db-panel-note { font-size: 11px; color: #94a3b8; margin: -8px 0 12px; font-style: italic; }
  .db-panel-full { width: 100%; flex-basis: 100%; }

  /* Panel header row: title on the left, total-N chip on the right.
     The chip surfaces the denominator so per-bar percentages have an explicit base.
     On the rank matrix the chip reads "with known rank" because that panel excludes
     engagements with no matched rank, so its N can be lower than total engagements —
     the label keeps a smaller N from looking like a bug. */
  .db-panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 0 0 16px;
  }
  .db-panel-head .db-panel-title { margin: 0; }
  .db-panel-total {
    flex-shrink: 0;
    background: #f0f4f8; border: 1px solid #d1d9e0; border-radius: 999px;
    padding: 3px 12px; font-size: 12px; font-weight: 700; color: #003366;
    font-family: 'Source Sans 3', sans-serif; white-space: nowrap;
  }

  /* Bar chart rows */
  .db-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .db-bar-label {
    width: 120px; font-size: 12px; color: #475569; text-align: right;
    flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .db-bar-track { height: 22px; background: #f1f5f9; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .db-bar-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .db-bar-val { font-size: 12px; font-weight: 700; color: #1a2a3a; min-width: 40px; }

  /* Monthly columns */
  .db-monthly { display: flex; align-items: flex-end; gap: 16px; height: 130px; margin-top: 28px; overflow: visible; }
  .db-month-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .db-month-val { font-size: 13px; font-weight: 700; color: #003366; margin-bottom: 4px; }
  .db-month-bar {
    width: 100%; max-width: 48px; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #003366, #2e86c1);
    transition: height 0.5s ease;
  }
  .db-month-label { font-size: 12px; color: #64748b; margin-top: 6px; font-weight: 600; }

  /* Heatmap tiles */
  .db-tiles {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .db-tile {
    padding: 10px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;
    text-align: center; transition: all 0.3s;
  }
  @media (max-width: 700px) {
    .db-tiles { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 460px) {
    .db-tiles { grid-template-columns: repeat(2, 1fr); }
  }
  .db-tile-num { font-size: 18px; font-weight: 800; margin-top: 2px; font-family: 'Playfair Display', serif; }

  /* School drill-down panel (Schools & Reach tab, third panel) */
  .db-drill-pills {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px; padding-bottom: 16px;
    border-bottom: 1px solid #e8edf2;
  }
  .db-drill-pill {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid #d1d9e0; background: #f0f4f8; color: #1a2a3a;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .db-drill-pill:hover { background: #e1e9f1; border-color: #b1bdc7; }
  .db-drill-pill.active {
    background: #003366; color: #fff; border-color: #003366;
  }
  .db-drill-meta { font-size: 12px; color: #64748b; margin-bottom: 12px; }
  .db-drill-meta strong { color: #003366; font-weight: 700; }
  .db-drill-bars { display: flex; flex-direction: column; gap: 6px; }
  .db-drill-row {
    display: grid;
    grid-template-columns: 220px 1fr 64px;
    align-items: center; gap: 12px;
    font-size: 12px;
  }
  /* Label cell wraps the truncating label so we can put title + custom tooltip on a
     non-overflow:hidden parent. Without this, ::after escapes get clipped by the label. */
  .db-drill-label-cell { position: relative; min-width: 0; }
  .db-drill-label {
    color: #475569; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Custom hover tooltip — shows immediately (no native 1s delay), only when the cell
     has a title attribute (which we only set for labels long enough to truncate). */
  .db-drill-label-cell[title]:hover::after {
    content: attr(title);
    position: absolute;
    bottom: calc(100% + 4px); right: 0;
    background: #1a2a3a; color: #fff;
    padding: 5px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 500;
    white-space: nowrap; max-width: 420px;
    overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 8px rgba(0,20,50,0.15);
    z-index: 10; pointer-events: none;
    font-family: 'Source Sans 3', sans-serif;
    font-style: normal;
  }
  .db-drill-track {
    background: #f1f5f9; border-radius: 6px;
    height: 22px; overflow: hidden;
  }
  .db-drill-fill {
    background: linear-gradient(90deg, #1a5276, #1a5276dd);
    height: 100%; border-radius: 6px;
    transition: width 0.4s ease;
  }
  .db-drill-count {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 14px; font-weight: 700;
    color: #1a2a3a; text-align: right;
  }
  /* Right cell now stacks the engagement count over a muted unique-participant count,
     so a high-engagement / low-people org (e.g. DGHI) reads as concentrated at a glance. */
  .db-drill-count-cell { display: flex; flex-direction: column; align-items: flex-end; }
  .db-drill-people { font-size: 10px; color: #94a3b8; font-weight: 600; line-height: 1.1; margin-top: 1px; }
  /* "Unspecified" rows are placeholder values for contacts with no Primary Org filled in yet.
     De-emphasized to distinguish from real sub-orgs without hiding the data from view. */
  .db-drill-row.unspec .db-drill-label { font-style: italic; color: #94a3b8; }
  .db-drill-row.unspec .db-drill-fill { background: linear-gradient(90deg, #94a3b8, #94a3b8dd); }
  .db-drill-row.unspec .db-drill-count { color: #94a3b8; font-style: italic; }
  .db-drill-row.unspec .db-drill-people { font-style: italic; }
  @media (max-width: 700px) {
    .db-drill-row { grid-template-columns: 140px 1fr 56px; gap: 8px; }
  }

  /* Named Programs panel */
  .db-program-card {
    background: #f8fafc; border-radius: 12px; padding: 20px 22px;
    margin-bottom: 14px; border: 1px solid #e8edf2;
  }
  .db-program-card:last-child { margin-bottom: 0; }
  .db-program-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .db-program-name {
    font-size: 17px; font-weight: 700; color: #1a2a3a;
    font-family: 'Playfair Display', serif;
  }
  .db-program-stats {
    font-size: 12px; color: #64748b; margin-top: 4px;
  }
  .db-program-stats strong { color: #003366; font-weight: 700; }
  .db-program-spark-wrap {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .db-program-spark-label {
    font-size: 10px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 600;
  }
  .db-program-subtitle {
    font-size: 12px; font-weight: 700; color: #475569;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 16px 0 10px;
  }
  .db-program-subtitle:first-child { margin-top: 0; }
  .db-program-empty {
    text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 13px;
  }


  /* Donut */
  .db-donut-wrap { display: flex; align-items: center; gap: 24px; }
  .db-donut-container { position: relative; }
  .db-donut-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
  }
  .db-donut-total {
    font-size: 28px; font-weight: 800; color: #1a2a3a;
    font-family: 'Playfair Display', serif;
  }
  .db-donut-label2 {
    font-size: 10px; color: #94a3b8; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .db-legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .db-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .db-legend-text { font-size: 12px; color: #475569; flex: 1; }
  .db-legend-val { font-size: 12px; font-weight: 700; color: #1a2a3a; }

  /* Table */
  .db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .db-table th {
    text-align: left; padding: 10px 12px; border-bottom: 2px solid #e8edf2;
    color: #64748b; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .db-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  .db-table td.bold { font-weight: 600; color: #1a2a3a; }
  .db-badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700;
  }
  .db-badge-green { background: #ecfdf5; color: #059669; }
  .db-badge-yellow { background: #fef9c3; color: #b45309; }

  /* Staff heatmap */
  .db-heat-table { border-collapse: collapse; font-size: 11px; width: 100%; }
  .db-heat-table th {
    padding: 6px 8px; text-align: center; color: #64748b;
    font-weight: 600; border-bottom: 2px solid #e8edf2;
  }
  .db-heat-table th:first-child { text-align: left; }
  .db-heat-table td { padding: 5px 8px; text-align: center; border-radius: 4px; }
  .db-heat-table td:first-child { text-align: left; color: #475569; white-space: nowrap; }

  /* Loading */
  .db-loading { text-align: center; padding: 80px 20px; }
  .db-loading-busy {
    width: 40px; height: 40px; border: 3px solid #e8edf2;
    border-top-color: #003366; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .db-loading p { color: #94a3b8; font-size: 14px; }

  .db-footer { text-align: center; padding: 32px 20px; font-size: 12px; color: #94a3b8; letter-spacing: 0.3px; }

  @media (max-width: 700px) {
    .db-kpis { flex-direction: column; }
    .db-panels { flex-direction: column; }
    .db-panel { min-width: auto; }
  }
  /* Demonstration banner. Same treatment as the dossier pages — dark bar,
     uppercase, letterspaced mono — in this page's own palette rather than the
     dossier's, since the two visual languages are not reconciled until the
     front page migrates (v11 §K19). Present in markup and removed on the live
     path, so a script failure leaves the banner standing rather than removing
     it: the failure mode points the safe way. */
  .demo-banner {
    padding: 11px 24px;
    background: #001A33;
    color: #D8DCE4;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; text-align: center;
  }
  .demo-banner strong { color: #FFFFFF; font-weight: 500; }
</style>
</head>
<body>

<script>
  // ============================================================
  // CONFIGURATION — paste your real values locally before deploy.
  // (A placeholder -> real-value mapping was provided alongside this file.)
  // While SPREADSHEET_ID is still the placeholder, the dashboard runs in DEMO mode.
  // ============================================================

  // Your Google Sheet ID (the long string in the sheet URL between /d/ and /edit).
  // One canonical workbook — unchanged across fiscal years.
  const SPREADSHEET_ID = "YOUR_SPREADSHEET_ID_HERE";

  // Shared / canonical tabs — identical across every fiscal year.
  const CONTACTS_GID = "YOUR_CONTACTS_GID_HERE";   // Contacts tab
  const LOOKUPS_GID  = "YOUR_LOOKUPS_GID_HERE";    // Lookups tab

  // Per-fiscal-year transactional tabs.
  // To add a future year: copy a block, set its label and two GIDs, and (optionally)
  // point DEFAULT_FY at it. Nothing else in the file needs to change.
  const FY_TABS = {
    "FY25-26": {
      engagementsGid: "YOUR_ENGAGEMENTS_GID_HERE",
      eventsGid:      "YOUR_EVENTS_GID_HERE",
    },
    "FY26-27": {
      engagementsGid: "YOUR_ENGAGEMENTS_GID_HERE",
      eventsGid:      "YOUR_EVENTS_GID_HERE",
    },
  };

  // The fiscal year shown on first load (the current FY).
  const DEFAULT_FY = "FY26-27";

  // Set to true to show the Staff tab, false to hide it
  const SHOW_STAFF_TAB = false;
</script>

<!-- Header -->
<div class="demo-banner">
  <strong>Demonstration — synthetic data.</strong> No real contact records appear on this page.
</div>
<div class="db-header">
  <div class="db-header-inner">
    <div>
      <div class="db-header-title">Faculty Development Connect: <b>Dashboards</b></div>
      <div class="db-header-sub">Duke University · Center for Teaching & Learning</div>
    </div>
    <div class="db-live">
      <div class="db-live-dot"></div>
      <span>Live data</span>

function parseCSV(text) {
  const rows = [];
  let current = '';
  let inQuotes = false;
  let row = [];

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(current.trim()); current = ''; }
      else if (ch === '\n' || (ch === '\r' && text[i+1] === '\n')) {
        row.push(current.trim()); current = '';
        if (row.some(c => c)) rows.push(row);
        row = [];
        if (ch === '\r') i++;
      } else { current += ch; }
    }
  }
  if (current || row.length) { row.push(current.trim()); if (row.some(c => c)) rows.push(row); }
  return rows;
}

async function fetchSheet(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Failed to load sheet (gid=${gid}): ${resp.status}`);
  const text = await resp.text();
  return parseCSV(text);
}

function rowsToObjects(rows) {
  if (rows.length < 2) return [];
  let headerIdx = 0;
  const row0filled = rows[0].filter(c => c && c.trim()).length;
  const row1filled = rows.length > 1 ? rows[1].filter(c => c && c.trim()).length : 0;
  if (row1filled > row0filled) headerIdx = 1;

  const headers = rows[headerIdx].map(h => (h || '').trim());
  const dataRows = rows.slice(headerIdx + 1);
  return dataRows.map(row => {
    const obj = {};
    headers.forEach((h, i) => { if (h) obj[h] = (row[i] || '').trim(); });
    return obj;
  }).filter(obj => Object.values(obj).some(v => v));
}

async function loadAllData() {
  document.getElementById('loading').classList.remove('hidden');
  document.querySelectorAll('.db-section').forEach(s => s.classList.add('hidden'));
  const fybar = document.getElementById('fybar');
  if (fybar) fybar.classList.add('hidden');

  try {
    if (SPREADSHEET_ID === "YOUR_SPREADSHEET_ID_HERE") {
      // DEMO MODE — generate sample data spanning all configured fiscal years
      loadDemoData();
    } else {
      const b = document.querySelector(".demo-banner");
      if (b) b.remove();
      const fyKeys = Object.keys(FY_TABS);
      // Fetch the shared tabs once, plus each FY's engagement + events tabs, in parallel.
      const [conRows, lookupRows, ...fyResults] = await Promise.all([
        fetchSheet(CONTACTS_GID),
        fetchSheet(LOOKUPS_GID),
        ...fyKeys.flatMap(fy => [
          fetchSheet(FY_TABS[fy].engagementsGid),
          fetchSheet(FY_TABS[fy].eventsGid),
        ]),
      ]);
      contacts = rowsToObjects(conRows);
      // Parse rank categories from Lookups Column J (index 9), rows after header (row 2 onward)
      const rankVals = lookupRows.slice(2).map(r => (r[9] || '').trim()).filter(v => v);
      if (rankVals.length) RANK_LABELS = rankVals;
      // fyResults is [eng, evt, eng, evt, ...] aligned to fyKeys order.
      engagementsByFY = {};
      eventsByFY = {};
      fyKeys.forEach((fy, i) => {
        engagementsByFY[fy] = rowsToObjects(fyResults[i * 2]);
        eventsByFY[fy] = rowsToObjects(fyResults[i * 2 + 1]);
      });
    }

    document.getElementById('loading').classList.add('hidden');
    if (!FY_TABS[currentFY]) currentFY = Object.keys(FY_TABS)[0];
    populateFYSelect();
    if (fybar) fybar.classList.remove('hidden');
    applyFY(currentFY);
    document.getElementById('lastUpdated').textContent =
      ` · Last refreshed: ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#dc2626;">Error loading data: ${err.message}</p>
       <p style="color:#94a3b8;margin-top:8px;">Check that your Spreadsheet ID and GID numbers are correct, and that the sheet is published to the web.</p>
       <button onclick="loadAllData()" style="margin-top:16px;padding:10px 24px;border-radius:10px;border:1.5px solid #003366;background:#fff;color:#003366;font-weight:600;cursor:pointer;">Retry</button>`;
  }
}

// Points the flat `engagements` / `events` globals at the selected fiscal year, resets the
// drill-down cache (so the Schools tab recomputes for the new year), and re-renders the
// current tab. Contacts and Lookups are shared, so they're untouched here.
function applyFY(fy) {
  if (!FY_TABS[fy] && !(fy in engagementsByFY)) return;
  currentFY = fy;
  engagements = engagementsByFY[fy] || [];
  events = eventsByFY[fy] || [];
  drillDownActiveSchool = null;
  drillDownData = null;
  const sel = document.getElementById('fySelect');
  if (sel && sel.value !== fy) sel.value = fy;
  renderCurrentTab();
}

// Fills the FY dropdown from FY_TABS (so adding a future year needs no UI edit) and
// selects the current fiscal year.
function populateFYSelect() {
  const sel = document.getElementById('fySelect');
  if (!sel) return;
  sel.innerHTML = Object.keys(FY_TABS)
    .map(fy => `<option value="${fy}">${fy}</option>`)
    .join('');
  sel.value = currentFY;
}

  Object.keys(E).forEach(function (fy) {
    engagementsByFY[fy] = E[fy].map(function (r) {
      return {
        "Engagement ID":       r[0],
        "Contact ID":          C[r[1]][0],
        "School/Unit":         T.sc[r[2]],
        "Engagement Type":     T.ty[r[3]],
        "Date of Engagement":  r[4],
        "Staff Member":        T.sf[r[5]],
        "Topic Area\n(Primary)": T.tp[r[6]],
        "Fac Dev Program":     T.pr[r[7]],
        "Rank":                T.rk[r[8]],
        "Status":              T.st[r[9]]
      };
    });
  });

  /* FY25-26 holds no events deliberately: it exercises the empty-events
     state, and it is also the true story — the events programme began
     in FY26-27. */
  eventsByFY = {};
  Object.keys(V).forEach(function (fy) {
    eventsByFY[fy] = V[fy].map(function (r) {
      return { "Event ID": r[0], "Event Name": r[1], "Date": r[2],
               "Topic Area(s)": r[3], "# Registrants": String(r[4]),
               "# Attendees": String(r[5]), "Schools Reached": String(r[6]) };
    });
  });
}

// TAB SWITCHING
// ============================================================
let currentTab = 'overview';

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.db-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCurrentTab();
}

function renderCurrentTab() {
  document.querySelectorAll('.db-section').forEach(s => s.classList.add('hidden'));
  // The single-year FY dropdown is meaningless on the comparison tab — hide it there.
  const fybar = document.getElementById('fybar');
  if (fybar) fybar.classList.toggle('hidden', currentTab === 'yoy');
  const el = document.getElementById('tab-' + currentTab);
  if (!el) return;

  switch(currentTab) {
    case 'overview': renderOverview(el); break;
    case 'schools': renderSchools(el); break;
    case 'topics': renderTopics(el); break;
    case 'events': renderEvents(el); break;
    case 'yoy': renderYoY(el); break;
    case 'staff': renderStaff(el); break;
  }
  el.classList.remove('hidden');
}

// ============================================================
// HELPERS
// ============================================================
function getField(obj, ...keys) {
  for (const k of keys) {
    for (const objKey of Object.keys(obj)) {
      if (objKey.toLowerCase().replace(/[\n\r]/g,' ').includes(k.toLowerCase())) return obj[objKey];
    }
  }
  return '';
}

function countBy(arr, fieldNames) {
  const counts = {};
  arr.forEach(item => {
    const val = getField(item, ...fieldNames) || 'Unknown';
    counts[val] = (counts[val] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1] - a[1]);
}

function uniqueByField(arr, fieldNames) {
  const seen = new Set();
  arr.forEach(item => {
    const val = getField(item, ...fieldNames);
    if (val) seen.add(val);
  });
  return seen.size;
}

/**
 * Month order for a Duke fiscal year, which runs 1 July through 30 June.
 *
 * FIXED 13 AUGUST 2026. This array previously began with 'Aug' and carried
 * 'Jul' in the final position, so the fiscal year's FIRST month rendered as its
 * LAST. FY25-26 concealed it: the system launched in January 2026, so that year
 * holds only Jan-Jun, all in correct relative order within the back half of the
 * old array. FY26-27 exposed it the moment it held both July and August data —
 * the Monthly Engagement Trend read "Aug, Jul".
 *
 * Defined ONCE and referenced by both the Overview trend and the Year-over-Year
 * sparkline. It was previously duplicated in each, and the sparkline carried the
 * same defect unnoticed because it does not filter empty months, so all twelve
 * bars render and the misordering reads as less obviously wrong.
 *
 * The tokens must match what getMonth() returns.
 */
const FY_MONTH_ORDER = ['Jul','Aug','Sep','Oct','Nov','Dec',
                        'Jan','Feb','Mar','Apr','May','Jun'];

function getMonth(item) {
  const d = getField(item, 'Date of Engagement', 'Date');
  if (!d) return '';
  const m = d.substring(5,7);
  const names = {
    '01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun',
    '07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'
  };
  return names[m] || m;
}

// Builds a { contactID -> rank } lookup from the Contacts tab.
// Used by any view that needs to show rank on engagements.
function buildContactRankMap() {
  const map = {};
  contacts.forEach(c => {
    const id = getField(c, 'Contact ID');
    const rank = getField(c, 'Rank');
    if (id && rank) map[id] = rank;
  });
  return map;
}

// Builds a { contactID -> primary org } lookup from the Contacts tab (Column K).
// Substring match in getField handles "Duke Primary Org (Dept/Center)" or shorter aliases.
// Used by the within-school drill-down panel in the Schools & Reach tab.
function buildContactPrimaryOrgMap() {
  const map = {};
  contacts.forEach(c => {
    const id = getField(c, 'Contact ID');
    const org = getField(c, 'Primary Org', 'Duke Primary Org');
    if (id && org) map[id] = org;
  });
  return map;
}

// Renders a panel header row: title plus an optional total-N chip on the right.
// knownLabel (e.g. "with known rank") flags when N is a filtered subset rather than the
// full engagement count, so a smaller N reads as intentional, not a defect.
function panelHead(title, n, knownLabel) {
  const chip = (n != null)
    ? `<div class="db-panel-total">N = ${n}${knownLabel ? ' ' + knownLabel : ''}</div>`
    : '';
  return `<div class="db-panel-head"><div class="db-panel-title">${title}</div>${chip}</div>`;
}

function barHTML(label, value, max, width, color, showPct, total) {
  const barW = max > 0 ? (value / max) * width : 0;
  const pct = showPct && total > 0 ? ` (${Math.round(value/total*100)}%)` : '';
  return `<div class="db-bar-row">
    <div class="db-bar-label">${label}</div>
    <div class="db-bar-track" style="width:${width}px">
      <div class="db-bar-fill" style="width:${barW}px;background:linear-gradient(90deg,${color},${color}dd)"></div>
    </div>
    <div class="db-bar-val">${value}${pct}</div>
  </div>`;
}

// ============================================================
// RENDER: Overview
// ============================================================
function renderOverview(el) {
  const totalEng = engagements.length;
  const uniqueContacts = uniqueByField(engagements, ['Contact ID']);
  const totalEvents = events.length;
  const totalAtt = events.reduce((s,e) => s + (parseInt(getField(e,'Attendees','# Attendees')) || 0), 0);

  // Monthly
  const monthCounts = {};
  engagements.forEach(e => { const m = getMonth(e); if(m) monthCounts[m] = (monthCounts[m]||0)+1; });
  const monthData = FY_MONTH_ORDER.filter(m => monthCounts[m]).map(m => ({month:m, count:monthCounts[m]||0}));
  const maxMonth = Math.max(...monthData.map(d=>d.count), 1);

  // Topics
  const topicCounts = countBy(engagements, ['Topic Area','Primary Topic']);
  const topicMax = topicCounts.length ? topicCounts[0][1] : 1;

  // Types
  const typeCounts = countBy(engagements, ['Engagement Type']);
  const typeTotal = typeCounts.reduce((s,t)=>s+t[1],0);

  // Donut SVG
  const donutSize = 160, thickness = 28, r = (donutSize-thickness)/2, cx = donutSize/2, cy = donutSize/2;
  let cumPct = 0;
  const donutPaths = typeCounts.slice(0,9).map((t,i) => {
    const pct = t[1]/typeTotal;
    const startAngle = cumPct * 2 * Math.PI - Math.PI/2;
    const endAngle = (cumPct + pct) * 2 * Math.PI - Math.PI/2;
    cumPct += pct;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const largeArc = pct > 0.5 ? 1 : 0;
    // If there's only one segment (100%), render a full circle instead of an arc (arcs can't close on themselves)
    if (pct >= 0.999) {
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${DONUT_COLORS[i]}" stroke-width="${thickness}"/>`;
    }
    return `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}" fill="none" stroke="${DONUT_COLORS[i]}" stroke-width="${thickness}"/>`;
  }).join('');

  const legendHTML = typeCounts.slice(0,6).map((t,i) =>
    `<div class="db-legend-item">
      <div class="db-legend-dot" style="background:${DONUT_COLORS[i]}"></div>
      <span class="db-legend-text">${t[0]}</span>
      <span class="db-legend-val">${t[1]}</span>
    </div>`
  ).join('');

  el.innerHTML = `
    <div class="db-kpis">
      <div class="db-kpi"><div class="db-kpi-bar" style="background:#003366"></div>
        <div class="db-kpi-num" style="color:#003366">${totalEng}</div>
        <div class="db-kpi-label">Total Engagements</div><div class="db-kpi-sub">Programs, consultations, inquiries</div></div>
      <div class="db-kpi"><div class="db-kpi-bar" style="background:#1a5276"></div>
        <div class="db-kpi-num" style="color:#1a5276">${uniqueContacts}</div>
        <div class="db-kpi-label">Unique Contacts</div><div class="db-kpi-sub">Individual people engaged</div></div>
      <div class="db-kpi"><div class="db-kpi-bar" style="background:#2e86c1"></div>
        <div class="db-kpi-num" style="color:#2e86c1">${totalEvents}</div>
        <div class="db-kpi-label">Events Hosted</div><div class="db-kpi-sub">Large CTL events</div></div>
      <div class="db-kpi"><div class="db-kpi-bar" style="background:#148f77"></div>
        <div class="db-kpi-num" style="color:#148f77">${totalAtt}</div>
        <div class="db-kpi-label">Event Attendees</div><div class="db-kpi-sub">Across all events</div></div>
    </div>
    <div class="db-panels">
      <div class="db-panel">
        <div class="db-panel-title">Monthly Engagement Trend</div>
        <div class="db-monthly">
          ${monthData.map(m => `<div class="db-month-col">
            <div class="db-month-val">${m.count}</div>
            <div class="db-month-bar" style="height:${(m.count/maxMonth)*100}px"></div>
            <div class="db-month-label">${m.month}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="db-panel">
        <div class="db-panel-title">Engagement by Type</div>
        <div class="db-donut-wrap">
          <div class="db-donut-container">
            <svg width="${donutSize}" height="${donutSize}">${donutPaths}</svg>
            <div class="db-donut-center">
              <div class="db-donut-total">${typeTotal}</div>
              <div class="db-donut-label2">Total</div>
            </div>
          </div>
          <div style="flex:1">${legendHTML}</div>
        </div>
      </div>
    </div>
    <div class="db-panel db-panel-full">
      ${panelHead('Top Topic Areas', totalEng)}
      ${topicCounts.slice(0,8).map(t => barHTML(TOPICS_SHORT[t[0]]||t[0], t[1], topicMax, 320, '#003366', true, totalEng)).join('')}
    </div>
  `;
}

// ============================================================
// RENDER: Schools
// ============================================================
function renderSchools(el) {
  const schoolCounts = countBy(engagements, ['School','School/Unit']);
  const maxSchool = schoolCounts.length ? schoolCounts[0][1] : 1;

  function tileColor(val) {
    const intensity = val / maxSchool;
    if (intensity > 0.7) return {bg:'#003366',fg:'#fff'};
    if (intensity > 0.5) return {bg:'#1a5276',fg:'#fff'};
    if (intensity > 0.3) return {bg:'#4a7fb5',fg:'#fff'};
    if (intensity > 0.15) return {bg:'#85b1d9',fg:'#fff'};
    if (val > 0) return {bg:'#c5d9ed',fg:'#475569'};
    return {bg:'#f1f5f9',fg:'#94a3b8'};
  }

  const tilesHTML = schoolCounts.map(([school, count]) => {
    const c = tileColor(count);
    return `<div class="db-tile" style="background:${c.bg};color:${c.fg}">
      <div>${SCHOOLS_SHORT[school]||school}</div>
      <div class="db-tile-num">${count}</div>
    </div>`;
  }).join('');

  // School x Rank matrix
  // Join Engagement Log -> Contacts via Contact ID to get Rank per engagement
  const contactRankMap = buildContactRankMap();

  const RANK_SHORT = {
    'Tenured & Tenure Track Faculty': 'Tenured/TT',
    'Regular Rank Non Tenure Track faculty': 'Reg. Non-TT',
    'Non-Regular Rank Faculty': 'Non-Regular',
    'Grad Student/Postdoc': 'Grad/Postdoc',
    'Staff': 'Staff',
    'Other': 'Other'
  };

  // Build school x rank counts
  const schoolRankData = {};
  const schoolsInMatrix = new Set();
  engagements.forEach(e => {
    const school = getField(e, 'School', 'School/Unit');
    const cid = getField(e, 'Contact ID');
    const rank = contactRankMap[cid] || getField(e, 'Rank') || '';
    if (!school || !rank) return;
    schoolsInMatrix.add(school);
    const key = `${school}||${rank}`;
    schoolRankData[key] = (schoolRankData[key] || 0) + 1;
  });

  const matrixSchools = [...schoolsInMatrix].sort((a,b) => {
    const ta = Object.values(Object.fromEntries(
      Object.entries(schoolRankData).filter(([k]) => k.startsWith(a+'||'))
    )).reduce((s,v)=>s+v,0);
    const tb = Object.values(Object.fromEntries(
      Object.entries(schoolRankData).filter(([k]) => k.startsWith(b+'||'))
    )).reduce((s,v)=>s+v,0);
    return tb - ta;
  });

  // Sort schools by total engagement descending
  const schoolTotals = {};
  matrixSchools.forEach(s => {
    schoolTotals[s] = RANK_LABELS.reduce((sum, r) => sum + (schoolRankData[`${s}||${r}`] || 0), 0);
  });
  const sortedSchools = [...matrixSchools].sort((a,b) => schoolTotals[b] - schoolTotals[a]);

  const maxCell = Math.max(...sortedSchools.flatMap(s => RANK_LABELS.map(r => schoolRankData[`${s}||${r}`] || 0)), 1);

  // Column totals (down each rank) + grand total. Grand total reconciles the existing
  // row-total column and the new column-total row in the bottom-right corner.
  const colTotals = RANK_LABELS.map(rank =>
    sortedSchools.reduce((s, school) => s + (schoolRankData[`${school}||${rank}`] || 0), 0)
  );
  const grandTotal = colTotals.reduce((a, b) => a + b, 0);
  const totalsRow = `<tr style="border-top:2px solid #e8edf2;background:#f8fafc;font-weight:700">
    <td style="padding:6px 10px;white-space:nowrap;font-size:12px;color:#1a2a3a;border-right:1px solid #e8edf2">Total</td>
    ${colTotals.map(c => `<td style="padding:6px 8px;text-align:center;font-size:12px;color:#1a2a3a">${c || '·'}</td>`).join('')}
    <td style="padding:6px 10px;text-align:center;font-size:12px;color:#003366">${grandTotal}</td>
  </tr>`;

  const rankHeaders = RANK_LABELS.map(r => `<th style="font-size:11px;padding:6px 8px;white-space:nowrap">${RANK_SHORT[r]||r}</th>`).join('');
  const matrixRows = sortedSchools.map(school => {
    const cells = RANK_LABELS.map(rank => {
      const count = schoolRankData[`${school}||${rank}`] || 0;
      const intensity = count / maxCell;
      const bg = count === 0 ? '#f8fafc' : `rgba(0,51,102,${0.12+intensity*0.88})`;
      const fg = intensity > 0.45 ? '#fff' : '#475569';
      return `<td style="background:${bg};color:${fg};font-weight:${count>0?700:400};text-align:center;padding:6px 8px;border-radius:4px">${count||'·'}</td>`;
    }).join('');
    const rowTotal = schoolTotals[school];
    return `<tr>
      <td style="padding:6px 10px;white-space:nowrap;font-size:12px;color:#475569;border-right:1px solid #e8edf2">${SCHOOLS_SHORT[school]||school}</td>
      ${cells}
      <td style="padding:6px 10px;text-align:center;font-weight:700;font-size:12px;color:#003366">${rowTotal}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="db-panel db-panel-full" style="margin-bottom:20px">
      ${panelHead('Engagement Volume by School and Unit', engagements.length)}
      <p class="db-panel-note">Tile color intensity reflects engagement volume</p>
      <div class="db-tiles">${tilesHTML}</div>
    </div>
    <div class="db-panel db-panel-full">
      ${panelHead('School/Unit × Rank', grandTotal, 'with known rank')}
      <p class="db-panel-note">Engagement counts by school and faculty/staff rank. Color intensity reflects volume.</p>
      <div style="overflow-x:auto">
        <table class="db-heat-table" style="width:100%">
          <thead>
            <tr>
              <th style="text-align:left;padding:6px 10px;border-right:1px solid #e8edf2">School</th>
              ${rankHeaders}
              <th style="padding:6px 8px;color:#003366">Total</th>
            </tr>
          </thead>
          <tbody>${matrixRows}${totalsRow}</tbody>
        </table>
      </div>
    </div>
    ${renderSchoolDrillDownPanel()}
  `;
}

// ============================================================
// RENDER: Within-School Drill-Down (Schools & Reach tab, third panel)
// ============================================================
// Renders an interactive panel showing how engagements within a selected school
// distribute across that school's departments / centers / programs / units (Column K
// of Contacts). The school selector is a row of pills above the bars; clicking a pill
// re-renders just the detail (meta + bars) without rebuilding the whole tab.
function renderSchoolDrillDownPanel() {
  const contactPrimaryOrgMap = buildContactPrimaryOrgMap();

  // Build { school -> { primaryOrg -> {count, contacts:Set} } } by joining engagements to contacts.
  // We track distinct Contact IDs (not just engagement counts) so the panel can show unique
  // participants alongside engagement volume — surfacing concentrated cases like DGHI, where
  // many engagements represent only a handful of people.
  // When a contact's Primary Org equals the engagement's School/Unit, we treat it as
  // Unspecified — that pattern (e.g. Primary Org = "Graduate School, The") is a real-data
  // signal that the contact has no specific sub-unit assigned, not a meaningful department
  // or center. Folding into Unspecified keeps the de-emphasis consistent.
  const schoolToOrgs = {};
  engagements.forEach(e => {
    const school = getField(e, 'School', 'School/Unit');
    if (!school) return;
    const cid = getField(e, 'Contact ID');
    const orgRaw = cid && contactPrimaryOrgMap[cid];
    const org = (!orgRaw || orgRaw === school) ? 'Unspecified' : orgRaw;
    if (!schoolToOrgs[school]) schoolToOrgs[school] = {};
    if (!schoolToOrgs[school][org]) schoolToOrgs[school][org] = { count: 0, contacts: new Set() };
    schoolToOrgs[school][org].count += 1;
    if (cid) schoolToOrgs[school][org].contacts.add(cid);
  });

  // Sort schools by total engagement volume descending — highest-volume school becomes the default.
  const schoolTotals = {};
  Object.keys(schoolToOrgs).forEach(s => {
    schoolTotals[s] = Object.values(schoolToOrgs[s]).reduce((a, o) => a + o.count, 0);
  });
  const sortedSchools = Object.keys(schoolToOrgs).sort((a, b) => schoolTotals[b] - schoolTotals[a]);

  // Grand total across all schools — the denominator for the per-school "X/grand engagements"
  // line. Each engagement has exactly one school, so this is total engagements with a school.
  const grandTotalEng = Object.values(schoolTotals).reduce((a, b) => a + b, 0);

  if (!sortedSchools.length) {
    return `<div class="db-panel db-panel-full" style="margin-top:20px">
      <div class="db-panel-title">Engagement Volume Within Selected School</div>
      <p class="db-panel-note">No engagement data available yet.</p>
    </div>`;
  }

  // Pick or preserve active school. If the previous active school is no longer in the data
  // (e.g., after a refresh removed all its engagements), fall back to the highest-volume school.
  if (!drillDownActiveSchool || !schoolToOrgs[drillDownActiveSchool]) {
    drillDownActiveSchool = sortedSchools[0];
  }

  // Cache for fast pill-click re-renders (selectDrillDownSchool reads from this).
  drillDownData = { schoolToOrgs, grandTotalEng };

  const pillsHTML = sortedSchools.map(s => {
    const isActive = s === drillDownActiveSchool;
    const shortLabel = SCHOOLS_SHORT[s] || s;
    // Use data-school for the canonical name; the displayed label is the short form.
    return `<button class="db-drill-pill${isActive ? ' active' : ''}" data-school="${escapeAttr(s)}" onclick="selectDrillDownSchool(this.dataset.school)">${shortLabel}</button>`;
  }).join('');

  return `<div class="db-panel db-panel-full" style="margin-top:20px">
    <div class="db-panel-title">Engagement Volume Within Selected School</div>
    <p class="db-panel-note">Click a school to see how engagements distribute by department, center, program, or unit.</p>
    <div class="db-drill-pills">${pillsHTML}</div>
    <div id="db-drill-detail">${renderDrillDownDetail()}</div>
  </div>`;
}

// Renders just the meta line + bars for the currently active school.
// Called both on initial render and on pill click (without rebuilding the whole tab).
function renderDrillDownDetail() {
  if (!drillDownData || !drillDownActiveSchool) return '';
  const orgs = drillDownData.schoolToOrgs[drillDownActiveSchool] || {};
  // Org entries now carry {count, contacts:Set}; sort by engagement count descending.
  const orgEntries = Object.entries(orgs).sort((a, b) => b[1].count - a[1].count);
  const total = orgEntries.reduce((s, [, o]) => s + o.count, 0);
  const max = orgEntries.length ? orgEntries[0][1].count : 1;
  const grand = drillDownData.grandTotalEng || total;

  // School-level unique participants = distinct contacts across all of this school's orgs
  // (Unspecified included — a contact with no sub-org is still a real participant).
  const schoolContacts = new Set();
  orgEntries.forEach(([, o]) => o.contacts.forEach(c => schoolContacts.add(c)));
  const uniqueSchool = schoolContacts.size;

  // Named entries exclude "Unspecified" — that's a placeholder, not a real sub-org.
  // Counting it as a "department" or "center" would overstate the breadth.
  const namedCount = orgEntries.filter(([n]) => n !== 'Unspecified').length;
  const noun = SCHOOL_SUBORG_NOUN[drillDownActiveSchool] || ['unit', 'units'];
  const nounLabel = namedCount === 1 ? noun[0] : noun[1];
  const engLabel = total === 1 ? 'engagement' : 'engagements';
  const partLabel = uniqueSchool === 1 ? 'participant' : 'participants';
  const shortSchool = SCHOOLS_SHORT[drillDownActiveSchool] || drillDownActiveSchool;

  const meta = `<div class="db-drill-meta"><strong>${shortSchool}</strong> · ${total}/${grand} ${engLabel} · ${uniqueSchool} ${partLabel} · ${namedCount} ${nounLabel}</div>`;

  const barsHTML = orgEntries.map(([name, o]) => {
    const count = o.count;
    const people = o.contacts.size;
    const pct = (count / max) * 100;
    const isUnspec = (name === 'Unspecified');
    const cls = isUnspec ? 'db-drill-row unspec' : 'db-drill-row';
    const peopleLabel = people === 1 ? 'person' : 'people';
    // Only attach title when the name is long enough that the 220px column will truncate
    // (rough threshold ~28 chars at 12px Source Sans 3). Short names that already fit don't
    // need a hover tooltip — that would just feel like noise.
    const titleAttr = name.length > 28 ? ` title="${escapeAttr(name)}"` : '';
    return `<div class="${cls}">
      <div class="db-drill-label-cell"${titleAttr}>
        <div class="db-drill-label">${name}</div>
      </div>
      <div class="db-drill-track"><div class="db-drill-fill" style="width:${pct}%"></div></div>
      <div class="db-drill-count-cell">
        <div class="db-drill-count">${count}</div>
        <div class="db-drill-people">${people} ${peopleLabel}</div>
      </div>
    </div>`;
  }).join('');

  return meta + `<div class="db-drill-bars">${barsHTML}</div>`;
}

// Pill click handler. Updates module state, swaps active class on pills, re-renders the
// detail block. Avoids re-rendering the whole tab so we don't recompute the school-level
// matrix on every click.
function selectDrillDownSchool(school) {
  if (!drillDownData || !drillDownData.schoolToOrgs[school]) return;
  drillDownActiveSchool = school;
  document.querySelectorAll('.db-drill-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.school === school);
  });
  const detail = document.getElementById('db-drill-detail');
  if (detail) detail.innerHTML = renderDrillDownDetail();
}

// Small helper for HTML attribute escaping (single quotes, double quotes, ampersands).
// Sub-org names like "Markets & Management" and "Pierre R. Lamond Department" need this
// when they appear in data-school and title attributes.
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderProgramCards() {
  // Group engagements by Program Name (skipping blanks)
  const byProgram = {};
  engagements.forEach(e => {
    const p = getField(e, 'Fac Dev Program', 'Program Name');
    if (!p) return;

  });

  if (!programNames.length) {
    return `<div class="db-program-empty">
      No engagements logged to a named program yet. Program data will appear here as staff select a Fac Dev Program when logging engagements.

function renderSingleProgramCard(name, progEngagements, contactRankMap) {
  const total = progEngagements.length;

  // Unique participants
  const uniqueContacts = new Set();
  progEngagements.forEach(e => {
    const cid = getField(e, 'Contact ID');
    if (cid) uniqueContacts.add(cid);
  });
  const uniqueCount = uniqueContacts.size;

  // Reach by School (tiles)
  const schoolCounts = {};
  progEngagements.forEach(e => {
    const s = getField(e, 'School', 'School/Unit') || 'Unknown';
    schoolCounts[s] = (schoolCounts[s] || 0) + 1;
  });
  const schoolEntries = Object.entries(schoolCounts).sort((a, b) => b[1] - a[1]);
  const maxSchool = schoolEntries.length ? schoolEntries[0][1] : 1;

  function tileColor(val) {
    const intensity = val / maxSchool;
    if (intensity > 0.7) return { bg:'#003366', fg:'#fff' };
    if (intensity > 0.5) return { bg:'#1a5276', fg:'#fff' };
    if (intensity > 0.3) return { bg:'#4a7fb5', fg:'#fff' };
    if (intensity > 0.15) return { bg:'#85b1d9', fg:'#fff' };
    if (val > 0) return { bg:'#c5d9ed', fg:'#475569' };
    return { bg:'#f1f5f9', fg:'#94a3b8' };
  }

  const tilesHTML = schoolEntries.map(([school, count]) => {
    const c = tileColor(count);
    return `<div class="db-tile" style="background:${c.bg};color:${c.fg}">
      <div>${SCHOOLS_SHORT[school] || school}</div>
      <div class="db-tile-num">${count}</div>
    </div>`;
  }).join('');

  // By Rank (via Contacts join; falls back to rank on engagement itself if present)
  const rankCounts = {};
  progEngagements.forEach(e => {
    const cid = getField(e, 'Contact ID');
    const rank = contactRankMap[cid] || getField(e, 'Rank') || 'Unknown';
    rankCounts[rank] = (rankCounts[rank] || 0) + 1;
  });
  const rankEntries = Object.entries(rankCounts).sort((a, b) => b[1] - a[1]);
  const maxRank = rankEntries.length ? rankEntries[0][1] : 1;
  const rankBarsHTML = rankEntries.map(([rank, count]) =>
    barHTML(rank, count, maxRank, 260, '#1a5276', true, total)
  ).join('');

  // Monthly sparkline (only if >15 engagements)
  let sparkHTML = '';
  if (total > 15) {
    const monthCounts = {};
    progEngagements.forEach(e => {
      const m = getMonth(e);
      if (m) monthCounts[m] = (monthCounts[m] || 0) + 1;
    });
    const monthData = FY_MONTH_ORDER.map(m => ({ month: m, count: monthCounts[m] || 0 }));
    sparkHTML = `<div class="db-program-spark-wrap">
      <div class="db-program-spark-label">Monthly trend</div>
      ${sparklineSVG(monthData)}
    </div>`;
  }

  return `<div class="db-program-card">
    <div class="db-program-header">
      <div>
        <div class="db-program-name">${name}</div>
        <div class="db-program-stats">
          <strong>${total}</strong> ${total === 1 ? 'engagement' : 'engagements'} ·
          <strong>${uniqueCount}</strong> unique ${uniqueCount === 1 ? 'participant' : 'participants'}
        </div>
      </div>
      ${sparkHTML}
    </div>
    <div class="db-program-subtitle">Reach by School</div>
    <div class="db-tiles">${tilesHTML}</div>
    <div class="db-program-subtitle">By Rank</div>
    ${rankBarsHTML}
  </div>`;
}

function sparklineSVG(monthData) {
  const w = 160, h = 36, gap = 2;
  const barW = (w - gap * (monthData.length - 1)) / monthData.length;
  const maxVal = Math.max(...monthData.map(m => m.count), 1);
  const bars = monthData.map((m, i) => {
    const barH = Math.max((m.count / maxVal) * (h - 2), m.count > 0 ? 1 : 0);
    return `<rect x="${i * (barW + gap)}" y="${h - barH}" width="${barW}" height="${barH}"
      fill="#003366" opacity="${m.count > 0 ? 0.85 : 0.12}" rx="1"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" style="display:block">${bars}</svg>`;
}

function renderStaff(el) {

// ============================================================
// RENDER: Year over Year (cross-fiscal-year comparison)
// ============================================================
// Reads engagementsByFY / eventsByFY directly (all years), not the single-FY globals.

// Display short labels for long program names (full logged name -> short). Programs not
// listed here render with their full logged name, so unanticipated programs need no
// pre-coding. NOTE: CPC carries the cohort year in its name, so its FY26-27 cohort will be
// a distinct key — revisit a "program family" mapping for cross-year alignment when that
// cohort's name actually exists (see v5 outstanding work).
const PROGRAMS_SHORT = {
  "Faculty Peer Course Evaluation Program": "Faculty Peer Course Evaluation",
  "Collaborative Project Courses Faculty Fellows (CPC 2026)": "Collaborative Project Courses (2026)",
  "Collaborative Project Courses Faculty Fellows (CPC 2026-2027)": "Collaborative Project Courses (2026-27)",
  "AI in Education at Duke Summit, Pre-Summit Workshops": "AI Summit Pre-Summit Workshops",
};

// Coverage qualifier per FY. An explicit override wins (FY25-26 only ever holds six months
// of data); otherwise it's derived from today's date — a FY whose June 30 end has passed
// reads "full year," one still open reads "year to date." So the current FY relabels itself
// to "full year" the moment the next FY begins, with no manual edit at rollover.
const FY_COVERAGE_OVERRIDE = { "FY25-26": "six months" };
function fyCoverage(fy) {
  if (FY_COVERAGE_OVERRIDE[fy]) return FY_COVERAGE_OVERRIDE[fy];
  const endYY = parseInt(String(fy).slice(-2), 10);
  if (isNaN(endYY)) return '';
  const concluded = new Date() >= new Date(2000 + endYY, 6, 1); // on/after July 1 of end year
  return concluded ? 'full year' : 'year to date';
}

const RANK_SHORT_YOY = {
  'Tenured & Tenure Track Faculty': 'Tenured/TT',
  'Regular Rank Non Tenure Track faculty': 'Reg. Non-TT',
  'Non-Regular Rank Faculty': 'Non-Regular',
  'Grad Student/Postdoc': 'Grad/Postdoc',
  'Staff': 'Staff',
};
// Known ranks shown in the comparison; "Other"/unmatched are set aside, the same way the
// School x Rank matrix uses "with known rank".
const YOY_RANKS = ['Tenured & Tenure Track Faculty','Regular Rank Non Tenure Track faculty','Non-Regular Rank Faculty','Grad Student/Postdoc','Staff'];

// Color per FY: the newest (in-progress) year gets Duke navy; older years step through
// muted shades. Supports more than two years for when the comparison grows.
function yoyColor(i, n) {
  if (i === n - 1) return '#003366';
  return ['#94a3b8','#2e86c1','#7fb3d8','#5dade2'][i] || '#94a3b8';
}

// One FY -> aggregated metrics (counts + unique-participant Sets per dimension).
function fyAggregate(fy, rankMap) {
  const eng = engagementsByFY[fy] || [];
  const evt = eventsByFY[fy] || [];
  const a = {
    totalEng: eng.length,
    uniqueContacts: uniqueByField(eng, ['Contact ID']),
    events: evt.length,
    attendees: evt.reduce((s,e)=> s + (parseInt(getField(e,'Attendees','# Attendees'))||0), 0),
    type:{}, typeP:{}, topic:{}, topicP:{}, school:{}, schoolP:{}, rank:{}, rankP:{}, programs:{}
  };
  function bump(cMap, pMap, key, cid){ if(!key) return; cMap[key]=(cMap[key]||0)+1; if(cid){(pMap[key]=pMap[key]||new Set()).add(cid);} }
  eng.forEach(e => {
    const cid = getField(e,'Contact ID');
    const school = getField(e,'School','School/Unit');
    const rank = rankMap[cid] || getField(e,'Rank') || '';
    bump(a.type, a.typeP, getField(e,'Engagement Type'), cid);
    bump(a.topic, a.topicP, getField(e,'Topic Area','Topic'), cid);
    bump(a.school, a.schoolP, school, cid);
    if (rank) bump(a.rank, a.rankP, rank, cid);
    const prog = getField(e,'Fac Dev Program','Program Name');
    if (prog) { const p=a.programs[prog]=a.programs[prog]||{eng:0,people:new Set(),schools:new Set()}; p.eng++; if(cid)p.people.add(cid); if(school)p.schools.add(school); }
  });
  return a;
}

// Builds { key -> { fy -> {eng, people} } } for a dimension, unioned across all FYs.
function yoyDim(aggByFy, fys, cKey, pKey) {
  const keys = new Set();
  fys.forEach(fy => Object.keys(aggByFy[fy][cKey]).forEach(k => keys.add(k)));
  const out = {};
  keys.forEach(k => {
    out[k] = {};
    fys.forEach(fy => {
      out[k][fy] = { eng: aggByFy[fy][cKey][k]||0, people: aggByFy[fy][pKey][k] ? aggByFy[fy][pKey][k].size : 0 };
    });
  });
  return out;
}

function yoySumEng(perFy, fys) { return fys.reduce((s,fy)=> s + (perFy[fy] ? perFy[fy].eng : 0), 0); }

function yoyBarsHTML(perFy, fys, colorByFy, max) {
  return fys.map(fy => {
    const d = perFy[fy] || {eng:0, people:0};
    const w = max > 0 ? Math.round(d.eng / max * 100) : 0;
    return `<div class="db-yoy-bar"><div class="db-yoy-track"><div class="db-yoy-fill" style="width:${w}%;background:${colorByFy[fy]}"></div></div><div class="db-yoy-val"><span class="e">${d.eng}</span> · ${d.people} ppl</div></div>`;
  }).join('');
}

function yoyBlock(title, keys, labelFor, dim, fys, colorByFy, note) {
  let max = 1;
  keys.forEach(k => fys.forEach(fy => { const v = dim[k] && dim[k][fy] ? dim[k][fy].eng : 0; if (v > max) max = v; }));
  const rows = keys.length
    ? keys.map(k => `<div class="db-yoy-row"><div class="db-yoy-label">${labelFor(k)}</div><div class="db-yoy-bars">${yoyBarsHTML(dim[k]||{}, fys, colorByFy, max)}</div></div>`).join('')
    : `<p class="db-panel-note">No data yet for the years shown.</p>`;
  return `<div class="db-panel db-panel-full" style="margin-bottom:20px">${panelHead(title)}${note?`<p class="db-panel-note">${note}</p>`:''}<div class="db-yoy-grp">${rows}</div></div>`;
}

// Reach over time: per-FY unique contacts, distinct contacts across all years (union of
// Contact IDs — the shared identity that makes de-duplication possible), and returning
// contacts (a year's contacts also seen in a prior year). The gap between the naive per-FY
// sum and the all-years distinct total equals the returning count.
function renderReachOverTime(fys, colorByFy) {
  const setByFy = {};
  fys.forEach(fy => {
    const s = new Set();
    (engagementsByFY[fy] || []).forEach(e => { const id = getField(e,'Contact ID'); if (id) s.add(id); });
    setByFy[fy] = s;
  });
  const seenPrior = new Set();
  const rowData = fys.map((fy, i) => {
    const uniq = setByFy[fy].size;
    let returning = null;                 // null -> "—" for the first year (no prior year)
    if (i > 0) { returning = 0; setByFy[fy].forEach(id => { if (seenPrior.has(id)) returning++; }); }
    setByFy[fy].forEach(id => seenPrior.add(id));
    return { fy, uniq, returning };
  });
  const rows = rowData.map(r => `
    <tr>
      <td style="padding:8px 10px;font-size:13px;color:#475569;border-right:1px solid #e8edf2;white-space:nowrap">
        <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${colorByFy[r.fy]};margin-right:8px"></span>${r.fy} <span style="color:#94a3b8">(${fyCoverage(r.fy)})</span>
      </td>
      <td style="padding:8px 12px;text-align:center;font-size:14px;font-weight:700;color:#1a2a3a">${r.uniq}</td>
      <td style="padding:8px 12px;text-align:center;font-size:13px;color:${r.returning===null?'#cbd5e1':'#475569'}">${r.returning===null?'—':r.returning}</td>
    </tr>`).join('');

  return `
    <div class="db-panel db-panel-full" style="margin:8px 0 20px">
      ${panelHead('Reach over time')}
      <p class="db-panel-note">Per-FY unique contacts can't be summed — the same person re-engaging in a later year would be counted twice.</p>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr>
              <th style="text-align:left;padding:8px 10px;font-size:12px;color:#64748b;border-bottom:1px solid #e8edf2;border-right:1px solid #e8edf2">Fiscal Year</th>
              <th style="text-align:center;padding:8px 12px;font-size:12px;color:#64748b;border-bottom:1px solid #e8edf2">Unique Contacts (per FY)</th>
              <th style="text-align:center;padding:8px 12px;font-size:12px;color:#64748b;border-bottom:1px solid #e8edf2">Returning Contacts</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderYoY(el) {
  const fys = Object.keys(FY_TABS);
  const colorByFy = {}; fys.forEach((fy,i)=> colorByFy[fy] = yoyColor(i, fys.length));
  const rankMap = buildContactRankMap();
  const agg = {}; fys.forEach(fy => agg[fy] = fyAggregate(fy, rankMap));

  const inProg = fys.find(fy => fyCoverage(fy) === 'year to date');
  const banner = inProg
    ? `<div class="db-yoy-banner">${inProg} is in progress — figures are year to date, so totals aren't a like-for-like comparison with a completed year.</div>`
    : '';
  const legend = `<div class="db-yoy-legend">${fys.map(fy => `<span><span class="k" style="background:${colorByFy[fy]}"></span>${fy} (${fyCoverage(fy)})</span>`).join('')}</div>`;

  const allDistinctSet = new Set();
  fys.forEach(fy => (engagementsByFY[fy]||[]).forEach(e => { const id = getField(e,'Contact ID'); if (id) allDistinctSet.add(id); }));
  const allDistinct = allDistinctSet.size;

  const kpiDefs = [
    { label:'Total engagements', val: fy => agg[fy].totalEng },
    { label:'Unique contacts',   val: fy => agg[fy].uniqueContacts, extra: { label:'All Distinct', value: allDistinct } },
    { label:'Events hosted',     val: fy => agg[fy].events },
    { label:'Event attendees',   val: fy => agg[fy].attendees },
  ];
  const kpis = kpiDefs.map(def => {
    const vals = fys.map(def.val);
    const max = Math.max(1, ...vals, def.extra ? def.extra.value : 0);
    const rows = fys.map((fy,i) => {
      const w = Math.round(vals[i]/max*100);
      return `<div class="db-yoy-kpi-row"><span class="db-yoy-kpi-yr">${fy}</span><div class="db-yoy-kpi-track"><div class="db-yoy-kpi-fill" style="width:${w}%;background:${colorByFy[fy]}"></div></div><span class="db-yoy-kpi-num">${vals[i]}</span></div>`;
    }).join('');
    let extraRow = '';
    if (def.extra) {
      const w = Math.round(def.extra.value/max*100);
      extraRow = `<div class="db-yoy-kpi-row db-yoy-kpi-total"><span class="db-yoy-kpi-yr db-yoy-kpi-totlab">${def.extra.label}</span><div class="db-yoy-kpi-track"><div class="db-yoy-kpi-fill" style="width:${w}%;background:#003366"></div></div><span class="db-yoy-kpi-num db-yoy-kpi-totnum">${def.extra.value}</span></div>`;
    }
    return `<div class="db-yoy-kpi"><div class="db-yoy-kpi-label">${def.label}</div>${rows}${extraRow}</div>`;
  }).join('');

  const typeDim = yoyDim(agg, fys, 'type', 'typeP');
  const typeKeys = Object.keys(typeDim).sort((a,b)=> yoySumEng(typeDim[b],fys)-yoySumEng(typeDim[a],fys));
  const topicDim = yoyDim(agg, fys, 'topic', 'topicP');
  const topicKeys = Object.keys(topicDim).sort((a,b)=> yoySumEng(topicDim[b],fys)-yoySumEng(topicDim[a],fys));
  const schoolDim = yoyDim(agg, fys, 'school', 'schoolP');
  const schoolKeys = Object.keys(schoolDim).sort((a,b)=> yoySumEng(schoolDim[b],fys)-yoySumEng(schoolDim[a],fys)).slice(0,5);
  const rankDim = yoyDim(agg, fys, 'rank', 'rankP');
  const rankKeys = YOY_RANKS.filter(r => rankDim[r]);

  const progRecur = {};
  fys.forEach(fy => Object.keys(agg[fy].programs).forEach(p => progRecur[p]=(progRecur[p]||0)+1));
  const pfCols = fys.map(fy => {
    const progs = Object.entries(agg[fy].programs).sort((a,b)=> b[1].eng - a[1].eng);
    const lines = progs.length
      ? progs.map(([name, d]) => {
          const recur = progRecur[name] > 1 ? `<span class="db-yoy-pf-tag">both years</span>` : '';
          const disp = PROGRAMS_SHORT[name] || name;
          return `<div class="db-yoy-pf-prog"><div class="db-yoy-pf-name">${disp}${recur}</div><div class="db-yoy-pf-stats"><span><b>${d.eng}</b> engagements</span><span><b>${d.people.size}</b> participants</span><span><b>${d.schools.size}</b> schools</span></div></div>`;
        }).join('')
      : `<div class="db-yoy-pf-prog" style="color:#94a3b8;font-style:italic">No programs logged yet</div>`;
    const n = progs.length;
    return `<div class="db-yoy-pf-col"><div class="db-yoy-pf-hd">${fy} <span style="color:#94a3b8;font-weight:400">(${fyCoverage(fy)})</span></div><div class="db-yoy-pf-sub">${n} program${n===1?'':'s'}${fyCoverage(fy)==='year to date'?' so far':''}</div>${lines}</div>`;
  }).join('');

  el.innerHTML = `
    ${banner}
    ${legend}
    <div class="db-panel db-panel-full" style="margin:8px 0 20px">
      ${panelHead('Headline metrics')}
      <div class="db-yoy-kpis">${kpis}</div>
      <p class="db-panel-note" style="margin-top:12px">The All Distinct figure counts each contact once across all years.</p>
    </div>
    ${renderReachOverTime(fys, colorByFy)}
    ${yoyBlock('Engagement by type', typeKeys, k=>k, typeDim, fys, colorByFy)}
    ${yoyBlock('Top topic areas', topicKeys, k=>TOPICS_SHORT[k]||k, topicDim, fys, colorByFy)}
    ${yoyBlock('Engagement by school & unit — top 5', schoolKeys, k=>SCHOOLS_SHORT[k]||k, schoolDim, fys, colorByFy)}
    ${yoyBlock('Engagement by rank', rankKeys, k=>RANK_SHORT_YOY[k]||k, rankDim, fys, colorByFy, 'Known ranks only; engagements without a matched rank are set aside.')}
    <div class="db-panel db-panel-full">
      ${panelHead('Program portfolio')}
      <p class="db-panel-note">Each year's named programs, with engagements, unique participants, and schools reached. Recurring programs are tagged.</p>
      <div class="db-yoy-pf">${pfCols}</div>
    </div>
  `;
}
